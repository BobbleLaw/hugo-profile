[build]
publish = "exampleSite/public"
command = "cd exampleSite && hugo --gc --minify --panicOnWarning --printPathWarnings --themesDir ../.."

[context.production.environment]
HUGO_VERSION = "0.164.0"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"
HUGO_THEME = "repo"

[context.split1]
command = "cd exampleSite && hugo --gc --minify --panicOnWarning --printPathWarnings --enableGitInfo --themesDir ../.."

[context.split1.environment]
HUGO_VERSION = "0.164.0"
HUGO_ENV = "production"
HUGO_THEME = "repo"

[context.deploy-preview]
command = "cd exampleSite && hugo --gc --minify --panicOnWarning --printPathWarnings --buildFuture --themesDir ../.. -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.164.0"
HUGO_THEME = "repo"

[context.branch-deploy]
command = "cd exampleSite && hugo --gc --minify --panicOnWarning --printPathWarnings --themesDir ../.. -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.164.0"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"
